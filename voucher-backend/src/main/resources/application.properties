spring.application.name=voucher

# H2 Datenbank (In-Memory)
spring.datasource.url=jdbc:h2:mem:voucherdb;DB_CLOSE_DELAY=-1

#spring.datasource.url=jdbc:mysql://localhost:3306/voucherdb?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
